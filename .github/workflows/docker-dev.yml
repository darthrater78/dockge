name: Docker Dev Build (GHCR)

on:
  push:
    branches-ignore:
      - master
    paths-ignore:
      - '*.md'
  pull_request:
    branches: [master]
    paths-ignore:
      - '*.md'

permissions: {}

jobs:
  dev-build-ghcr:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm clean-install --no-fund

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build:frontend

      - name: Generate dev tag
        id: tag
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          SAFE_BRANCH=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9._-]/-/g' | cut -c1-128)
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          echo "DEV_TAG=dev-${SAFE_BRANCH}-${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Build and push dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name == 'push' }}
          target: release
          tags: |
            ghcr.io/${{ github.repository_owner }}/dockge:dev
            ghcr.io/${{ github.repository_owner }}/dockge:${{ env.DEV_TAG }}
