name: Docker Release (GHCR)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release-ghcr:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm clean-install --no-fund

      - name: Read version from package.json
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Determine if pre-release
        id: prerelease
        run: |
          if echo "$VERSION" | grep -qE '(alpha|beta|rc|dev)'; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Build frontend
        run: npm run build:frontend

      - name: Build and push image (stable)
        if: env.IS_PRERELEASE == 'false'
        run: npm run build:docker

      - name: Build and push image (pre-release)
        if: env.IS_PRERELEASE == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          target: release
          tags: |
            ghcr.io/${{ github.repository_owner }}/dockge:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/dockge:beta
